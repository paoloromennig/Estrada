<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15171a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Estrada — Controlo de Ganhos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2315171a%22/><circle cx=%2250%22 cy=%2250%22 r=%2230%22 fill=%22none%22 stroke=%22%23f2a93b%22 stroke-width=%226%22/><circle cx=%2250%22 cy=%2250%22 r=%224%22 fill=%22%23f2a93b%22/><line x1=%2250%22 y1=%2250%22 x2=%2268%22 y2=%2236%22 stroke=%22%232bb3a3%22 stroke-width=%226%22 stroke-linecap=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt-0:#101216;
    --asphalt-1:#17191d;
    --asphalt-2:#1f2227;
    --asphalt-3:#282c33;
    --line-amber:#f2a93b;
    --line-amber-dim:#8a662a;
    --signal-teal:#2bb3a3;
    --signal-teal-dim:#1c6e66;
    --chalk:#eef0f2;
    --chalk-dim:#9aa1ab;
    --chalk-faint:#5b616b;
    --danger:#e5586b;
    --danger-dim:#5c2a30;
    --good:#6fce8f;
    --radius:16px;
    --font-ui:'Manrope',sans-serif;
    --font-num:'Space Mono',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--asphalt-0);
    background-image:
      repeating-linear-gradient(180deg, transparent 0 42px, rgba(242,169,59,0.035) 42px 44px);
    color:var(--chalk);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--asphalt-1);
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.5);
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 14px;
    border-bottom:1px dashed var(--asphalt-3);
    position:sticky; top:0; z-index:20;
    background:var(--asphalt-1);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-num);
    font-weight:700;
    font-size:15px;
    letter-spacing:2px;
    color:var(--chalk);
  }
  .brand svg{ width:22px; height:22px; }
  .car-chip{
    font-family:var(--font-num);
    font-size:12px;
    letter-spacing:1px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--asphalt-3);
    color:var(--chalk-dim);
    background:var(--asphalt-2);
    max-width:180px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .car-chip.on{ color:var(--asphalt-0); background:var(--line-amber); border-color:var(--line-amber); font-weight:700; }

  /* ---------- Main ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:20px 20px 110px;
  }
  .section-title{
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--chalk-faint);
    margin:0 0 12px;
    font-weight:700;
  }
  .card{
    background:var(--asphalt-2);
    border:1px solid var(--asphalt-3);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }
  .card + .section-title{ margin-top:26px; }

  /* ---------- Odometer / readouts ---------- */
  .odometer{
    display:flex;
    gap:10px;
    margin:6px 0 4px;
  }
  .odo-cell{
    flex:1;
    background:var(--asphalt-0);
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
    border:1px solid var(--asphalt-3);
  }
  .odo-val{
    font-family:var(--font-num);
    font-size:22px;
    font-weight:700;
    color:var(--line-amber);
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  .odo-label{
    font-size:9.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--chalk-faint);
    margin-top:4px;
  }

  /* ---------- Forms ---------- */
  label{
    display:block;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--chalk-dim);
    margin:14px 0 6px;
    font-weight:600;
  }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=number], input[type=time], input[type=date], select{
    width:100%;
    background:var(--asphalt-0);
    border:1px solid var(--asphalt-3);
    border-radius:10px;
    padding:13px 14px;
    color:var(--chalk);
    font-family:var(--font-num);
    font-size:16px;
    outline:none;
    transition:border-color .15s;
  }
  select{ font-family:var(--font-ui); font-weight:600; }
  input:focus, select:focus{ border-color:var(--line-amber); }
  .row2{ display:flex; gap:12px; }
  .row2 > div{ flex:1; }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip-btn{
    flex:1;
    min-width:90px;
    background:var(--asphalt-0);
    border:1px solid var(--asphalt-3);
    color:var(--chalk-dim);
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
    font-family:var(--font-ui);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .chip-btn.sel{ border-color:var(--line-amber); color:var(--line-amber); background:rgba(242,169,59,0.08); }
  .chip-btn .sub{ display:block; font-size:10px; font-weight:500; color:var(--chalk-faint); margin-top:2px; }
  .chip-btn.sel .sub{ color:var(--line-amber-dim); }

  button.primary{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--line-amber);
    color:#1a1400;
    font-family:var(--font-ui);
    font-weight:800;
    font-size:15px;
    letter-spacing:.3px;
    cursor:pointer;
  }
  button.primary.stop{ background:var(--danger); color:#2a0d12; }
  button.secondary{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:1px dashed var(--asphalt-3);
    border-radius:12px;
    background:transparent;
    color:var(--chalk-dim);
    font-family:var(--font-ui);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  button.ghost-sm{
    background:none; border:none; color:var(--chalk-faint);
    font-family:var(--font-ui); font-size:12px; font-weight:700;
    cursor:pointer; padding:4px 8px;
  }
  button.ghost-sm.danger{ color:var(--danger); }

  /* ---------- Live timer ---------- */
  .live{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    background:rgba(43,179,163,0.1);
    border:1px solid var(--signal-teal-dim);
    border-radius:10px;
    margin-bottom:16px;
  }
  .live-dot{ width:8px; height:8px; border-radius:50%; background:var(--signal-teal); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .live-text{ font-size:12px; color:var(--signal-teal); font-weight:700; letter-spacing:.5px; }
  .live-time{ margin-left:auto; font-family:var(--font-num); font-size:15px; color:var(--signal-teal); font-variant-numeric:tabular-nums; }

  /* ---------- List rows ---------- */
  .list-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0;
    border-top:1px dashed var(--asphalt-3);
  }
  .list-row:first-child{ border-top:none; }
  .lr-main{ font-size:13px; font-weight:700; color:var(--chalk); }
  .lr-sub{ font-size:11px; color:var(--chalk-faint); margin-top:2px; }
  .lr-val{ font-family:var(--font-num); font-size:13px; color:var(--line-amber); text-align:right; }
  .lr-actions{ display:flex; gap:4px; }

  .empty{
    text-align:center; padding:30px 10px; color:var(--chalk-faint); font-size:13px;
  }

  /* ---------- Tab nav ---------- */
  .tabbar{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:480px;
    display:flex;
    background:var(--asphalt-1);
    border-top:1px dashed var(--asphalt-3);
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    z-index:30;
  }
  .tab{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--chalk-faint);
    padding:6px 0; cursor:pointer; font-family:var(--font-ui);
    font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  }
  .tab svg{ width:20px; height:20px; }
  .tab.active{ color:var(--line-amber); }
  .tab.active svg{ stroke:var(--line-amber); }

  /* ---------- Reports ---------- */
  .period-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; }
  .period-btn{
    flex:0 0 auto;
    padding:9px 14px; border-radius:999px;
    background:var(--asphalt-2); border:1px solid var(--asphalt-3);
    color:var(--chalk-dim); font-size:12px; font-weight:700; cursor:pointer;
    white-space:nowrap;
  }
  .period-btn.sel{ background:var(--line-amber); border-color:var(--line-amber); color:#1a1400; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .stat-box{ background:var(--asphalt-0); border:1px solid var(--asphalt-3); border-radius:10px; padding:14px; }
  .stat-box .v{ font-family:var(--font-num); font-size:19px; color:var(--chalk); font-weight:700; }
  .stat-box .l{ font-size:10px; color:var(--chalk-faint); text-transform:uppercase; letter-spacing:1px; margin-top:4px; }
  .stat-box.hi .v{ color:var(--good); }
  .stat-box.lo .v{ color:var(--danger); }
  .stat-box.amber .v{ color:var(--line-amber); }
  .stat-box.teal .v{ color:var(--signal-teal); }

  .bar-row{ margin-top:14px; }
  .bar-label{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:5px; color:var(--chalk-dim); font-weight:700; }
  .bar-track{ height:8px; background:var(--asphalt-0); border-radius:6px; overflow:hidden; border:1px solid var(--asphalt-3); }
  .bar-fill{ height:100%; border-radius:6px; }

  .verdict{
    border-radius:12px; padding:16px; margin-top:18px;
    font-size:13px; line-height:1.55;
    border:1px solid;
  }
  .verdict.good{ background:rgba(111,206,143,0.08); border-color:var(--good); color:var(--good); }
  .verdict.warn{ background:rgba(242,169,59,0.08); border-color:var(--line-amber); color:var(--line-amber); }
  .verdict.bad{ background:rgba(229,88,107,0.08); border-color:var(--danger); color:var(--danger); }

  .divider-road{
    border:none; border-top:2px dashed var(--asphalt-3); margin:22px 0;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="shell">

  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="30" stroke="#f2a93b" stroke-width="7"/><circle cx="50" cy="50" r="4" fill="#f2a93b"/><line x1="50" y1="50" x2="68" y2="36" stroke="#2bb3a3" stroke-width="7" stroke-linecap="round"/></svg>
      ESTRADA
    </div>
    <div id="activeCarChip" class="car-chip">sem turno</div>
  </div>

  <main id="main"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="turno">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Turno
    </button>
    <button class="tab" data-tab="carros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17a2 2 0 100-4 2 2 0 000 4zM18 17a2 2 0 100-4 2 2 0 000 4zM4 13l1.5-5A2 2 0 017.4 6.5h9.2a2 2 0 011.9 1.4L20 13v4H4v-4z"/></svg>
      Carros
    </button>
    <button class="tab" data-tab="relatorios">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      Relatórios
    </button>
  </nav>

</div>

<script>
/* ============================================================
   ESTRADA — controlo de ganhos Uber Eats / Glovo
   Armazenamento local (localStorage), sem servidor.
   ============================================================ */

const STORAGE_KEY = 'estrada_v1';
const FUEL_LABEL = { gasoleo:'Gasóleo', gasolina:'Gasolina', gas:'Gás (GPL)' };
const FUEL_UNIT_COST_WARN = 0.35; // acima disto, avisar

function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function eur(v){ return (Math.round((v||0)*100)/100).toFixed(2).replace('.', ',') + ' €'; }
function num(v,d=1){ return (Math.round((v||0)*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); }

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { cars:[], shifts:[], refuels:[], active:null };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();
let activeTab = 'turno';
let selectedCarForStart = null;
let reportPeriod = 'semana';
let customFrom = null, customTo = null;
let liveTimerHandle = null;

// ---------- Date helpers ----------
function parseDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function endOfWeek(d){ const s=startOfWeek(d); const e=new Date(s); e.setDate(e.getDate()+6); return e; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }

function getPeriodRange(){
  const now = new Date();
  if(reportPeriod === 'semana'){ return [startOfWeek(now), endOfWeek(now)]; }
  if(reportPeriod === 'semana_passada'){ const s=startOfWeek(now); s.setDate(s.getDate()-7); const e=new Date(s); e.setDate(e.getDate()+6); return [s,e]; }
  if(reportPeriod === 'mes'){ return [startOfMonth(now), endOfMonth(now)]; }
  if(reportPeriod === 'custom' && customFrom && customTo){ return [parseDate(customFrom), parseDate(customTo)]; }
  return [startOfWeek(now), endOfWeek(now)];
}
function inRange(iso, from, to){
  const d = parseDate(iso);
  return d >= from && d <= new Date(to.getFullYear(),to.getMonth(),to.getDate(),23,59,59);
}

// ---------- Render root ----------
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
  const main = document.getElementById('main');
  if(activeTab==='turno') main.innerHTML = renderTurno();
  else if(activeTab==='carros') main.innerHTML = renderCarros();
  else main.innerHTML = renderRelatorios();

  const chip = document.getElementById('activeCarChip');
  if(state.active){
    const car = state.cars.find(c=>c.id===state.active.carId);
    chip.textContent = car ? (car.apelido || car.matricula) : '—';
    chip.classList.add('on');
  } else {
    chip.textContent = 'sem turno';
    chip.classList.remove('on');
  }

  attachHandlers();
  clearInterval(liveTimerHandle);
  if(activeTab==='turno' && state.active){
    liveTimerHandle = setInterval(updateLiveTimer, 1000);
  }
}

function updateLiveTimer(){
  const el = document.getElementById('liveTime');
  if(!el || !state.active) return;
  const start = new Date(state.active.data+'T'+state.active.horaInicio+':00');
  const diffMs = Date.now() - start.getTime();
  const h = Math.floor(diffMs/3600000);
  const m = Math.floor((diffMs%3600000)/60000);
  const s = Math.floor((diffMs%60000)/1000);
  el.textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ---------- TAB: TURNO ----------
function renderTurno(){
  if(state.cars.length===0){
    return `<div class="empty">Ainda não tens nenhum carro cadastrado.<br><br>Vai a <strong>Carros</strong> e adiciona o primeiro antes de iniciar um turno.</div>`;
  }

  if(!state.active){
    if(selectedCarForStart===null) selectedCarForStart = state.cars[0].id;
    const carChips = state.cars.map(c=>`
      <div class="chip-btn ${c.id===selectedCarForStart?'sel':''}" data-pick-car="${c.id}">
        ${c.apelido || c.matricula}
        <span class="sub">${c.matricula} · ${FUEL_LABEL[c.tipo]}</span>
      </div>`).join('');

    return `
      <div class="section-title">Iniciar turno</div>
      <div class="card">
        <label>Qual carro vais usar?</label>
        <div class="chips">${carChips}</div>
        <label>Km de início</label>
        <input type="number" inputmode="decimal" id="kmInicio" placeholder="ex: 84210">
        <div class="row2">
          <div>
            <label>Data</label>
            <input type="date" id="dataInicio" value="${todayISO()}">
          </div>
          <div>
            <label>Hora de início</label>
            <input type="time" id="horaInicio" value="${nowHHMM()}">
          </div>
        </div>
        <button class="primary" id="btnStart">Iniciar turno</button>
      </div>
      ${renderTodayShifts()}
    `;
  }

  // turno ativo
  const car = state.cars.find(c=>c.id===state.active.carId);
  return `
    <div class="live">
      <div class="live-dot"></div>
      <div class="live-text">EM TURNO · ${car ? (car.apelido||car.matricula) : ''}</div>
      <div class="live-time" id="liveTime">00:00:00</div>
    </div>
    <div class="section-title">Terminar turno</div>
    <div class="card">
      <div class="odometer">
        <div class="odo-cell"><div class="odo-val">${state.active.kmInicio}</div><div class="odo-label">km início</div></div>
        <div class="odo-cell"><div class="odo-val">${state.active.horaInicio}</div><div class="odo-label">hora início</div></div>
      </div>
      <label>Km de fim</label>
      <input type="number" inputmode="decimal" id="kmFim" placeholder="ex: 84350">
      <label>Hora de fim</label>
      <input type="time" id="horaFim" value="${nowHHMM()}">
      <div class="row2">
        <div>
          <label>Ganho Uber Eats (€)</label>
          <input type="number" inputmode="decimal" id="valorUber" placeholder="0,00">
        </div>
        <div>
          <label>Ganho Glovo (€)</label>
          <input type="number" inputmode="decimal" id="valorGlovo" placeholder="0,00">
        </div>
      </div>
      <button class="primary stop" id="btnStop">Terminar turno</button>
      <button class="secondary" id="btnCancel">Cancelar turno (não guardar)</button>
    </div>
    ${renderTodayShifts()}
  `;
}

function renderTodayShifts(){
  const today = todayISO();
  const list = state.shifts.filter(s=>s.data===today).sort((a,b)=>a.horaInicio.localeCompare(b.horaInicio));
  if(list.length===0) return '';
  const rows = list.map(s=>{
    const car = state.cars.find(c=>c.id===s.carId);
    const km = s.kmFim - s.kmInicio;
    const total = (s.valorUber*0.9) + s.valorGlovo;
    return `
      <div class="list-row">
        <div>
          <div class="lr-main">${s.horaInicio}–${s.horaFim} · ${car?(car.apelido||car.matricula):'?'}</div>
          <div class="lr-sub">${km} km · Uber ${eur(s.valorUber)} · Glovo ${eur(s.valorGlovo)}</div>
        </div>
        <div style="text-align:right;">
          <div class="lr-val">${eur(total)}</div>
          <button class="ghost-sm danger" data-del-shift="${s.id}">apagar</button>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="section-title">Turnos de hoje</div>
    <div class="card">${rows}</div>
  `;
}

// ---------- TAB: CARROS ----------
function renderCarros(){
  const carCards = state.cars.map(c=>{
    const refCount = state.refuels.filter(r=>r.carId===c.id).length;
    return `
      <div class="card">
        <div class="row2" style="align-items:flex-end;">
          <div><div class="lr-main" style="font-size:15px;">${c.apelido || c.matricula}</div>
          <div class="lr-sub">${c.matricula} · ${FUEL_LABEL[c.tipo]} · ${refCount} abastecimento(s)</div></div>
          <button class="ghost-sm danger" data-del-car="${c.id}">apagar</button>
        </div>
      </div>`;
  }).join('') || `<div class="empty">Nenhum carro cadastrado ainda.</div>`;

  const carOptionsForRefuel = state.cars.map(c=>`<option value="${c.id}">${c.apelido||c.matricula} (${FUEL_LABEL[c.tipo]})</option>`).join('');

  const refuelRows = state.refuels.slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,10).map(r=>{
    const car = state.cars.find(c=>c.id===r.carId);
    return `
      <div class="list-row">
        <div>
          <div class="lr-main">${r.data} · ${car?(car.apelido||car.matricula):'?'}</div>
          <div class="lr-sub">${r.km} km · ${r.litros} L · ${FUEL_LABEL[r.tipo]}</div>
        </div>
        <div style="text-align:right;">
          <div class="lr-val">${eur(r.valor)}</div>
          <button class="ghost-sm danger" data-del-refuel="${r.id}">apagar</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="section-title">Os teus carros</div>
    ${carCards}
    <button class="secondary" id="btnAddCar">+ Adicionar carro</button>

    <hr class="divider-road">

    <div class="section-title">Registar abastecimento</div>
    <div class="card">
      <label>Carro</label>
      <select id="refCar">${carOptionsForRefuel}</select>
      <div class="row2">
        <div><label>Data</label><input type="date" id="refData" value="${todayISO()}"></div>
        <div><label>Km no abastecimento</label><input type="number" inputmode="decimal" id="refKm" placeholder="ex: 84300"></div>
      </div>
      <div class="row2">
        <div><label>Litros</label><input type="number" inputmode="decimal" id="refLitros" placeholder="ex: 40"></div>
        <div><label>Valor pago (€)</label><input type="number" inputmode="decimal" id="refValor" placeholder="ex: 62,00"></div>
      </div>
      <button class="primary" id="btnAddRefuel" ${state.cars.length===0?'disabled':''}>Guardar abastecimento</button>
    </div>

    ${refuelRows ? `<div class="section-title">Últimos abastecimentos</div><div class="card">${refuelRows}</div>` : ''}
  `;
}

// ---------- TAB: RELATÓRIOS ----------
function renderRelatorios(){
  const [from, to] = getPeriodRange();
  const shifts = state.shifts.filter(s=>inRange(s.data, from, to));
  const refuels = state.refuels.filter(r=>inRange(r.data, from, to));

  const nTurnos = shifts.length;
  let horasTotais=0, kmTotais=0, uberBruto=0, glovoBruto=0;
  shifts.forEach(s=>{
    const start = new Date(s.data+'T'+s.horaInicio+':00');
    let end = new Date(s.data+'T'+s.horaFim+':00');
    if(end < start) end.setDate(end.getDate()+1); // turno que passa da meia-noite
    horasTotais += (end-start)/3600000;
    kmTotais += (s.kmFim - s.kmInicio);
    uberBruto += s.valorUber;
    glovoBruto += s.valorGlovo;
  });
  const uberLiquido = uberBruto * 0.9;
  const glovoLiquido = glovoBruto;
  const ganhoTotal = uberLiquido + glovoLiquido;
  const horasMedias = nTurnos? horasTotais/nTurnos : 0;
  const kmMedios = nTurnos? kmTotais/nTurnos : 0;

  let litrosTotais=0, combustivelGasto=0;
  const porTipo = {};
  refuels.forEach(r=>{
    litrosTotais += r.litros;
    combustivelGasto += r.valor;
    porTipo[r.tipo] = (porTipo[r.tipo]||0) + r.valor;
  });

  const lucro = ganhoTotal - combustivelGasto;
  const pctCombustivel = ganhoTotal>0 ? (combustivelGasto/ganhoTotal*100) : 0;
  const eurPorKm = kmTotais>0 ? ganhoTotal/kmTotais : 0;
  const eurPorHora = horasTotais>0 ? ganhoTotal/horasTotais : 0;

  const plataformaTop = uberLiquido===glovoLiquido ? 'Empate' : (uberLiquido>glovoLiquido ? 'Uber Eats' : 'Glovo');
  const maxLiquido = Math.max(uberLiquido, glovoLiquido, 1);

  // por carro
  const carStats = state.cars.map(c=>{
    const cShifts = shifts.filter(s=>s.carId===c.id);
    const cRef = refuels.filter(r=>r.carId===c.id);
    const cGanho = cShifts.reduce((a,s)=>a+(s.valorUber*0.9)+s.valorGlovo,0);
    const cKm = cShifts.reduce((a,s)=>a+(s.kmFim-s.kmInicio),0);
    const cGasto = cRef.reduce((a,r)=>a+r.valor,0);
    return { car:c, ganho:cGanho, km:cKm, gasto:cGasto, turnos:cShifts.length };
  }).filter(cs=>cs.turnos>0 || cs.gasto>0);

  let verdictClass='good', verdictText='';
  if(ganhoTotal<=0 && combustivelGasto<=0){
    verdictText = 'Ainda sem dados suficientes neste período para uma avaliação.';
    verdictClass='warn';
  } else if(pctCombustivel >= 40){
    verdictClass='bad';
    verdictText = `O combustível está a consumir ${num(pctCombustivel,0)}% do que ganhaste — uma fatia grande. Vale a pena rever rotas, horários de menor trânsito ou o carro usado em cada turno.`;
  } else if(pctCombustivel >= 25){
    verdictClass='warn';
    verdictText = `O combustível representa ${num(pctCombustivel,0)}% dos teus ganhos. Está dentro do razoável, mas fica de olho — sobra líquido de ${eur(lucro)} neste período.`;
  } else {
    verdictClass='good';
    verdictText = `Boa margem: o combustível pesa só ${num(pctCombustivel,0)}% dos ganhos. Sobram ${eur(lucro)} depois de pagar o combustível.`;
  }

  const periodLabel = {
    semana:'Esta semana', semana_passada:'Semana passada', mes:'Este mês', custom:'Período personalizado'
  }[reportPeriod];

  return `
    <div class="period-row">
      <button class="period-btn ${reportPeriod==='semana'?'sel':''}" data-period="semana">Esta semana</button>
      <button class="period-btn ${reportPeriod==='semana_passada'?'sel':''}" data-period="semana_passada">Semana passada</button>
      <button class="period-btn ${reportPeriod==='mes'?'sel':''}" data-period="mes">Este mês</button>
      <button class="period-btn ${reportPeriod==='custom'?'sel':''}" data-period="custom">Personalizado</button>
    </div>
    ${reportPeriod==='custom' ? `
      <div class="card">
        <div class="row2">
          <div><label>De</label><input type="date" id="customFrom" value="${customFrom||todayISO()}"></div>
          <div><label>Até</label><input type="date" id="customTo" value="${customTo||todayISO()}"></div>
        </div>
        <button class="secondary" id="btnApplyCustom">Aplicar</button>
      </div>` : ''}

    <div class="section-title">${periodLabel} · ${toISO(from)} a ${toISO(to)}</div>
    <div class="card">
      <div class="stat-grid">
        <div class="stat-box hi"><div class="v">${eur(ganhoTotal)}</div><div class="l">Ganho líquido total</div></div>
        <div class="stat-box ${lucro>=0?'hi':'lo'}"><div class="v">${eur(lucro)}</div><div class="l">Lucro após combustível</div></div>
        <div class="stat-box"><div class="v">${nTurnos}</div><div class="l">Turnos</div></div>
        <div class="stat-box"><div class="v">${num(horasTotais,1)}h</div><div class="l">Horas trabalhadas</div></div>
        <div class="stat-box"><div class="v">${num(kmTotais,0)}</div><div class="l">Km totais</div></div>
        <div class="stat-box"><div class="v">${num(kmMedios,0)}</div><div class="l">Km médios / turno</div></div>
        <div class="stat-box"><div class="v">${num(horasMedias,1)}h</div><div class="l">Horas médias / turno</div></div>
        <div class="stat-box"><div class="v">${eur(eurPorHora)}</div><div class="l">€ por hora</div></div>
      </div>
    </div>

    <div class="section-title">Uber vs Glovo</div>
    <div class="card">
      <div class="bar-row">
        <div class="bar-label"><span>Uber Eats (líquido, −10%)</span><span>${eur(uberLiquido)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(uberLiquido/maxLiquido*100)}%; background:var(--signal-teal);"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Glovo (integral)</span><span>${eur(glovoLiquido)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(glovoLiquido/maxLiquido*100)}%; background:var(--line-amber);"></div></div>
      </div>
      <div class="lr-sub" style="margin-top:12px;">Plataforma que mais rendeu: <strong style="color:var(--chalk);">${plataformaTop}</strong></div>
    </div>

    <div class="section-title">Combustível</div>
    <div class="card">
      <div class="stat-grid">
        <div class="stat-box amber"><div class="v">${eur(combustivelGasto)}</div><div class="l">Gasto total</div></div>
        <div class="stat-box"><div class="v">${num(litrosTotais,1)} L</div><div class="l">Litros totais</div></div>
      </div>
      ${Object.keys(porTipo).length ? `<div style="margin-top:14px;">${Object.entries(porTipo).map(([t,v])=>`
        <div class="list-row"><div class="lr-main">${FUEL_LABEL[t]}</div><div class="lr-val">${eur(v)}</div></div>
      `).join('')}</div>` : ''}
    </div>

    ${carStats.length ? `
    <div class="section-title">Por carro</div>
    <div class="card">
      ${carStats.map(cs=>`
        <div class="list-row">
          <div>
            <div class="lr-main">${cs.car.apelido||cs.car.matricula}</div>
            <div class="lr-sub">${cs.turnos} turno(s) · ${num(cs.km,0)} km · gasto ${eur(cs.gasto)}</div>
          </div>
          <div class="lr-val">${eur(cs.ganho-cs.gasto)}</div>
        </div>
      `).join('')}
    </div>` : ''}

    <div class="verdict ${verdictClass}">${verdictText}</div>
  `;
}

// ---------- Handlers ----------
function attachHandlers(){
  document.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ activeTab=b.dataset.tab; render(); };
  });

  // TURNO
  document.querySelectorAll('[data-pick-car]').forEach(el=>{
    el.onclick = ()=>{ selectedCarForStart = el.dataset.pickCar; render(); };
  });
  const btnStart = document.getElementById('btnStart');
  if(btnStart) btnStart.onclick = ()=>{
    const km = parseFloat(document.getElementById('kmInicio').value);
    const data = document.getElementById('dataInicio').value;
    const hora = document.getElementById('horaInicio').value;
    if(!selectedCarForStart || isNaN(km) || !data || !hora){ alert('Preenche o km de início.'); return; }
    state.active = { carId: selectedCarForStart, data, horaInicio: hora, kmInicio: km };
    saveState(); render();
  };
  const btnStop = document.getElementById('btnStop');
  if(btnStop) btnStop.onclick = ()=>{
    const kmFim = parseFloat(document.getElementById('kmFim').value);
    const horaFim = document.getElementById('horaFim').value;
    const valorUber = parseFloat(document.getElementById('valorUber').value)||0;
    const valorGlovo = parseFloat(document.getElementById('valorGlovo').value)||0;
    if(isNaN(kmFim) || kmFim < state.active.kmInicio){ alert('Km de fim inválido.'); return; }
    state.shifts.push({
      id: uid(), carId: state.active.carId, data: state.active.data,
      horaInicio: state.active.horaInicio, kmInicio: state.active.kmInicio,
      horaFim, kmFim, valorUber, valorGlovo
    });
    state.active = null;
    saveState(); render();
  };
  const btnCancel = document.getElementById('btnCancel');
  if(btnCancel) btnCancel.onclick = ()=>{
    if(confirm('Cancelar o turno atual sem guardar?')){ state.active=null; saveState(); render(); }
  };
  document.querySelectorAll('[data-del-shift]').forEach(el=>{
    el.onclick = ()=>{ state.shifts = state.shifts.filter(s=>s.id!==el.dataset.delShift); saveState(); render(); };
  });

  // CARROS
  const btnAddCar = document.getElementById('btnAddCar');
  if(btnAddCar) btnAddCar.onclick = ()=>{
    const matricula = prompt('Matrícula do carro:');
    if(!matricula) return;
    const apelido = prompt('Nome/apelido curto (opcional, ex: "Diesel", "Carrinha"):') || '';
    let tipo = prompt('Tipo de combustível — escreve: gasoleo, gasolina ou gas');
    tipo = (tipo||'').trim().toLowerCase();
    if(!['gasoleo','gasolina','gas'].includes(tipo)){ alert('Tipo inválido. Usa gasoleo, gasolina ou gas.'); return; }
    state.cars.push({ id: uid(), matricula: matricula.toUpperCase(), apelido, tipo });
    saveState(); render();
  };
  document.querySelectorAll('[data-del-car]').forEach(el=>{
    el.onclick = ()=>{
      if(confirm('Apagar este carro? Os turnos e abastecimentos associados ficam guardados mas sem carro.')){
        state.cars = state.cars.filter(c=>c.id!==el.dataset.delCar);
        saveState(); render();
      }
    };
  });
  const btnAddRefuel = document.getElementById('btnAddRefuel');
  if(btnAddRefuel) btnAddRefuel.onclick = ()=>{
    const carId = document.getElementById('refCar').value;
    const data = document.getElementById('refData').value;
    const km = parseFloat(document.getElementById('refKm').value);
    const litros = parseFloat(document.getElementById('refLitros').value);
    const valor = parseFloat(document.getElementById('refValor').value);
    if(!carId || isNaN(km) || isNaN(litros) || isNaN(valor)){ alert('Preenche todos os campos do abastecimento.'); return; }
    const car = state.cars.find(c=>c.id===carId);
    state.refuels.push({ id: uid(), carId, data, km, litros, valor, tipo: car.tipo });
    saveState(); render();
  };
  document.querySelectorAll('[data-del-refuel]').forEach(el=>{
    el.onclick = ()=>{ state.refuels = state.refuels.filter(r=>r.id!==el.dataset.delRefuel); saveState(); render(); };
  });

  // RELATORIOS
  document.querySelectorAll('[data-period]').forEach(el=>{
    el.onclick = ()=>{ reportPeriod = el.dataset.period; render(); };
  });
  const btnApplyCustom = document.getElementById('btnApplyCustom');
  if(btnApplyCustom) btnApplyCustom.onclick = ()=>{
    customFrom = document.getElementById('customFrom').value;
    customTo = document.getElementById('customTo').value;
    render();
  };
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
